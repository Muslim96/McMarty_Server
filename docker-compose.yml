services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: staff_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      RUN_SEEDERS: "${RUN_SEEDERS:-true}"
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks: [staff]

  nginx:
    image: nginx:1.27-alpine
    container_name: staff_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [staff]

  mysql:
    image: mysql:8.4
    container_name: staff_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [staff]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: staff_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [staff]

volumes:
  mysql_data:

networks:
  staff:
